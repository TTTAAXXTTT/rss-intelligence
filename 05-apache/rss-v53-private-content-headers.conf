<LocationMatch "^/intelligence/">
    Header always set Cache-Control "private, no-store, max-age=0"
    Header always set Pragma "no-cache"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
</LocationMatch>

<LocationMatch "^/intelligence/[A-Fa-f0-9]{64}/translations/[a-f0-9]{64}\.html$">
    Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
</LocationMatch>
